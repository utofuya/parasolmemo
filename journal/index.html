---
layout: default
title: Journal
---
<main class="journal-page">
<a class="back-link" href="{{ '/' | relative_url }}">← ARCHIVE</a>
<h1>JOURNAL</h1>
<ul>
{% for post in site.posts %}
<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a><span>{{ post.date | date: "%Y . %m . %d" }}</span></li>
{% endfor %}
</ul>
</main>
